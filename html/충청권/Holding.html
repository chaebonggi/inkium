<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>충청북도·충청권 내일이음 취업박람회 - 홈페이지 준비 중</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      background-color: #f2f7fc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .holding-wrap {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holding-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
    }
    .blind {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>
<body>

  <main class="holding-wrap">
    <picture>
        <source media="(max-width: 768px)" srcset="./images/coming_soon_mo.jpg">
        <img src="./images/coming_soon_pc.jpg" alt="충청북도·충청권 내일이음 취업박람회 홈페이지 준비 중">
    </picture>
    
    <h1 class="blind">2026 충청북도·충청권 내일이음 취업박람회</h1>
    <div class="blind">
      <p>홈페이지 준비 중</p>
      <p>기업과 인재, 오늘과 내일을 잇는 새로운 만남이 시작됩니다. 더 나은 내일을 위한 채용의 장을 준비하고 있습니다.</p>
      <p>GRAND OPEN 2026. 10. 01. 목요일, 홈페이지가 정식 오픈됩니다.</p>
      <p>새로운 기회로 곧 찾아뵙겠습니다.</p>
    </div>
  </main>

</body>
</html>
